name: Android APK build and smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/halal-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: japan-halal-checker-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: japan-halal-checker-debug-apk
          path: apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: |
            adb install apk/app-debug.apk
            adb shell am start -n com.nazmul.japanhalalchecker/.MainActivity
            sleep 15
            adb shell pidof com.nazmul.japanhalalchecker
            adb logcat -d -t 1500 | grep -E 'FATAL EXCEPTION|AndroidRuntime' > crash-lines.txt || true
            if [ -s crash-lines.txt ]; then cat crash-lines.txt; exit 1; fi
