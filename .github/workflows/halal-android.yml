name: Android APK build and smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/halal-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [adfree, ads]
    env:
      HALAL_VARIANT: ${{ matrix.variant }}
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner includes the Android SDK. Avoid setup-android@v3:
      # its obsolete sdkmanager 'tools' package fails on current runners.
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "Android SDK found: $ANDROID_HOME"
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: japan-halal-checker-${{ matrix.variant }}-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  emulator-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        variant: [adfree, ads]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: japan-halal-checker-${{ matrix.variant }}-debug-apk
          path: apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -cores 2
          script: |
            adb install apk/app-debug.apk
            PACKAGE=com.nazmul.japanhalalchecker
            if [ '${{ matrix.variant }}' = 'ads' ]; then PACKAGE=com.nazmul.japanhalalchecker.ads; fi
            adb shell am start -n "$PACKAGE/.MainActivity"
            sleep 15
            adb shell pidof "$PACKAGE"
            adb logcat -d -t 1500 | grep -E 'FATAL EXCEPTION|AndroidRuntime' > crash-lines.txt || true
            if [ -s crash-lines.txt ]; then cat crash-lines.txt; exit 1; fi
