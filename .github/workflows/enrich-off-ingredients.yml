name: Enrich Missing Food Ingredients (Open Data)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/enrich_off_ingredients.py"
      - "tests/test_enrich_off_ingredients.py"
      - ".github/workflows/enrich-off-ingredients.yml"
  push:
    branches: [main]
    paths:
      - "scripts/enrich_off_ingredients.py"
      - "tests/test_enrich_off_ingredients.py"
      - ".github/workflows/enrich-off-ingredients.yml"
permissions:
  contents: write
concurrency:
  group: enrich-off-japan-ingredients
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test exact barcode matching, licensing, no overwriting and idempotence
        run: python -m unittest discover -s tests -p 'test_enrich_off_ingredients.py' -v

  enrich:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the licensed official OFF TSV export and fill ONLY missing ingredient texts
        run: python scripts/enrich_off_ingredients.py
      - name: Check manifest and ensure no manufactured halal claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/food-catalog-manifest.json').read_text())
          r=json.loads(Path('docs/ingredient-enrichment-report.json').read_text())
          assert r['catalogue_total']==m['catalogue_total_entries']
          assert m['total_unique_records']==r['catalogue_distinct_barcodes']
          assert r['catalogue_total']>=100000
          assert m['all_with_ingredient_text']==r['with_ingredient_text_after']
          assert r['with_ingredient_text_after']>=r['with_ingredient_text_before']
          assert r['new_ingredient_texts']==r['new_japan_texts']+r['new_supplemental_texts']
          print('AUDITED recovered ingredient texts:',r['new_ingredient_texts'])
          PY
      - name: Save source-attributed open ingredients to the existing catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/openfoodfacts-japan.json data/world-food-shards/ data/food-catalog-manifest.json docs/ingredient-enrichment-report.json
          if ! git diff --cached --quiet; then
            git commit -m "data: recover missing ingredients from Open Food Facts official export (ODbL)"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No ingredient data changes"
          fi
