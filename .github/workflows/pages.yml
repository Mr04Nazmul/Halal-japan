name: Deploy Japan Halal Checker to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build imported Floot React website
        working-directory: floot-source
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
      - name: Assemble Floot React website as the site root
        run: |
          mkdir -p _site
          cp -a floot-source/dist/. _site/
          cp seven-eleven-catalog.html _site/seven-eleven-catalog.html
          cp halal-restaurants.html _site/halal-restaurants.html
          cp restaurant-data.js _site/restaurant-data.js
          cp places-prayer.html _site/places-prayer.html
          cp places-prayer.js _site/places-prayer.js
          mkdir -p _site/data
          cp data/off-japan-research.json _site/data/off-japan-research.json
          test -s _site/places-prayer.html
          test -s _site/places-prayer.js
          test -s _site/data/off-japan-research.json
          test -s _site/halal-restaurants.html
          test -s _site/restaurant-data.js
          test -s _site/index.html
          test -d _site/assets
          echo "Floot React prepared as site root. Scanner source is unchanged."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
