name: Deploy Japan Halal Checker to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build imported Floot React website
        working-directory: floot-source
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
      - name: Assemble static root and React edition
        run: |
          mkdir -p _site/floot
          rsync -a --exclude='.git' --exclude='.github' --exclude='floot-source' --exclude='_site' --exclude='node_modules' ./ _site/
          cp -a floot-source/dist/. _site/floot/
          test -s _site/index.html
          test -s _site/floot/index.html
          grep -q '/assets/\|./assets/' _site/floot/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
