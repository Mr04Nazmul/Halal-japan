name: Deploy Japan Halal Checker to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate app files
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f icon.svg
      - name: Prepare Floot React frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone Floot UI
        working-directory: floot-source
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Stage existing site and Floot edition
        run: |
          mkdir -p _site/floot
          rsync -a --exclude='.git' --exclude='.github' --exclude='floot-source' --exclude='_site' --exclude='node_modules' ./ _site/
          cp -r floot-source/dist/. _site/floot/
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
