name: Deploy Japan Halal Checker to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Bulk Import Japan Food Products", "Expand Food Catalog to 100k"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build imported Floot React website
        working-directory: floot-source
        run: |
          npm install --no-audit --no-fund
          node --test tests/ingredientDecision.test.cjs
          node --test tests/halalCertificates.test.cjs
          node --test tests/sevenElevenEvidence.test.cjs
          node --test tests/yamayoProducts.test.cjs
          node --test tests/topvaluProducts.test.cjs
          node --test tests/ingredientSourceLinks.test.cjs
          npm run build
          test -s dist/index.html
      - name: Assemble Floot React website as the site root
        run: |
          mkdir -p _site
          cp -a floot-source/dist/. _site/
          cp seven-eleven-catalog.html _site/seven-eleven-catalog.html
          cp halal-restaurants.html _site/halal-restaurants.html
          cp restaurant-data.js _site/restaurant-data.js
          cp places-prayer.html _site/places-prayer.html
          cp places-prayer.js _site/places-prayer.js
          mkdir -p _site/data
          cp data/off-japan-research.json _site/data/off-japan-research.json
          cp data/seven-premium-ingredient-signals-20261016.json _site/data/seven-premium-ingredient-signals-20261016.json
          if [ -s data/openfoodfacts-japan.json ]; then cp data/openfoodfacts-japan.json _site/data/openfoodfacts-japan.json; fi
          # Optional 100k supplemental food index. Barcode shards stay separate
          # so one camera scan never downloads the entire database.
          if [ -s data/food-catalog-manifest.json ]; then
            cp data/food-catalog-manifest.json _site/data/food-catalog-manifest.json
            cp data/world-food-name-index.json _site/data/world-food-name-index.json
            cp -a data/world-food-shards _site/data/world-food-shards
            python - <<'PY'
          import json
          from pathlib import Path
          root=Path("_site/data")
          manifest=json.loads((root/"food-catalog-manifest.json").read_text())
          assert manifest["total_unique_records"]>=100000
          assert (root/"world-food-name-index.json").stat().st_size>1000
          assert len(list((root/"world-food-shards").glob("*.json")))==manifest["barcode_shards"]
          print("Pages: published",manifest["total_unique_records"],"source-attributed food records")
          PY
          fi
          test -s _site/places-prayer.html
          test -s _site/places-prayer.js
          test -s _site/data/off-japan-research.json
          test -s _site/data/seven-premium-ingredient-signals-20261016.json
          test -s _site/halal-restaurants.html
          test -s _site/restaurant-data.js
          test -s _site/index.html
          test -d _site/assets
          echo "Floot React prepared as site root. Scanner source is unchanged."
      - name: Block private files in published Pages artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("_site")
          denied = ("**/.env", "**/.env.*", "**/*.pem", "**/*.key", "**/*.p12",
                    "**/*.sqlite", "**/*.sqlite3", "**/private-data/**",
                    "**/research/**", "**/manufacturer-yamayo*.json",
                    "**/ingredient-review.json", "**/ingredient-photo-leads.json",
                    "**/ingredient-source-audit.json", "**/manufacturer-research*.json")
          leaks = sorted({str(p) for pattern in denied for p in root.glob(pattern) if p.is_file()})
          if leaks:
              raise SystemExit("Blocked private data in Pages artifact: " + ", ".join(leaks[:12]))
          permitted = {"off-japan-research.json", "openfoodfacts-japan.json",
                       "food-catalog-manifest.json", "world-food-name-index.json",
                       "seven-premium-ingredient-signals-20261016.json"}
          unexpected = sorted(p.name for p in (root/"data").glob("*")
                              if p.is_file() and p.name not in permitted)
          if unexpected:
              raise SystemExit("Unexpected public dataset: " + ", ".join(unexpected))
          print("PASS: Pages artifact contains no blocked private research or secrets.")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
