name: Build Halal Checker WebView APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-webview/**'
      - '.github/workflows/halal-webview-apk.yml'
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check Android build tools and install SDK
        run: |
          echo "Java:" && java -version
          echo "Gradle:" && gradle --version
          echo "SDK:" && echo "${ANDROID_HOME:-not-set}"
          SDK_MANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDK_MANAGER" ]; then
            echo "::error::Android SDK command-line tools not found."
            exit 1
          fi
          echo "Using $SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          "$SDK_MANAGER" --list_installed
      - name: Build debug APK
        working-directory: android-webview
        run: gradle --no-daemon --stacktrace --console=plain assembleDebug
      - name: Verify APK exists
        run: test -s android-webview/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Japan-Halal-Checker-WebView-APK
          path: android-webview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
