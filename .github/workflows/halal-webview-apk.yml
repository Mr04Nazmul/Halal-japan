name: Build Halal Checker WebView APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-webview/**'
      - '.github/workflows/halal-webview-apk.yml'
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: android-webview
        run: gradle --no-daemon assembleDebug
      - name: Verify APK exists
        run: test -s android-webview/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Japan-Halal-Checker-WebView-APK
          path: android-webview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
