name: Bulk Import Japan Food Products
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch 1200 unique Japanese product records
        run: python scripts/import-openfoodfacts-japan.py
      - name: Commit dataset only if content changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/openfoodfacts-japan.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh 1200+ Japanese products from Open Food Facts (unverified)"
            git push
          fi
