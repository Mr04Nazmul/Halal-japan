name: Bulk Import Japan Food Products
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
  push:
    paths:
      - "scripts/import_off_japan_dump.py"
      - "scripts/bulk_off_japan_10k.py"
      - ".github/workflows/bulk-japan-products.yml"
permissions:
  contents: write
concurrency:
  group: bulk-japan-products
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stream official bulk export to collect up to 30000 Japan-tagged products
        env:
          TARGET_PRODUCTS: "30000"
        run: python scripts/import_off_japan_dump.py
      - name: Screen available ingredient text when dataset exists
        run: |
          if [ -f data/openfoodfacts-japan.json ]; then
            python scripts/screen-ingredients.py
          else
            echo "Source API unavailable and no prior data; skipping screening"
          fi
      - name: Commit safe research data and resume cursor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in data/openfoodfacts-japan.json data/off-japan-import-state.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "data: bulk Japan product research (unverified; ODbL)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
