name: Public source discovery status (paused)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/agent_reach_public_sources.py
      - .github/workflows/agent-reach-public-sources.yml
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record paused discovery status
        run: python scripts/agent_reach_public_sources.py
      - name: Write auditable run summary
        run: |
          python - <<'PY'
          import json, os, pathlib
          data=json.loads(pathlib.Path('data/research/agent_reach_public_sources.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write("## Public source discovery status\\n\\n")
              f.write("Status: **paused**\\n\\n")
              f.write(f"Reason: `{data['reason_code']}`\\n\\n")
              f.write("Candidate product records: **0**\\n\\n")
              f.write("New verified ingredient records: **0**\\n\\n")
              f.write("Supabase imports: **0**\\n")
          PY
      - name: Upload status report
        uses: actions/upload-artifact@v4
        with:
          name: public-source-discovery-status
          path: data/research/agent_reach_public_sources.json
          retention-days: 14
