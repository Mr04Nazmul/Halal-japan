name: Crawl4AI Japanese ingredient evidence
# Re-trigger public ingredient evidence crawl: 2026-10-17 12:29 JST
on:
  push:
    paths:
      - '.github/workflows/crawl4ai-ingredients.yml'
      - 'scripts/crawl4ai_ingredients.py'
      - 'scripts/japan_ingredient_source_terms.py'
      - 'scripts/extract_crawl_ingredient_candidates.py'
      - 'data/manufacturer_seed_urls.txt'
  workflow_dispatch:
    inputs:
      max_urls:
        description: 'Maximum URLs per run (1–250)'
        required: false
        default: '250'
  schedule:
    - cron: '12 * * * *'
concurrency:
  group: ingredient-collector-${{ github.workflow }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Restore prior public ingredient evidence and attempt history
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data /tmp/crawl4ai-previous
          previous_run="$(gh api "repos/$REPOSITORY/actions/artifacts?name=crawl4ai-ingredient-evidence&per_page=30" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')"
          if [ -n "$previous_run" ]; then
            if gh run download "$previous_run" --repo "$REPOSITORY" -n crawl4ai-ingredient-evidence -D /tmp/crawl4ai-previous; then
              for file in crawl4ai_ingredient_evidence.jsonl http_ingredient_evidence.jsonl manufacturer_ingredient_candidates.csv crawl4ai_attempted_urls.txt http_attempted_urls.txt; do
                if [ -f "/tmp/crawl4ai-previous/$file" ]; then
                  cp "/tmp/crawl4ai-previous/$file" "data/$file"
                fi
              done
              echo "Restored Crawl4AI evidence and attempt history from run $previous_run"
            else
              echo "Previous evidence artifact unavailable; continuing without restore"
            fi
          else
            echo "No previous Crawl4AI evidence artifact; starting a fresh evidence history"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          for evidence_name, attempted_name in (
              ("crawl4ai_ingredient_evidence.jsonl", "crawl4ai_attempted_urls.txt"),
              ("http_ingredient_evidence.jsonl", "http_attempted_urls.txt"),
          ):
              evidence = Path("data") / evidence_name
              attempted = Path("data") / attempted_name
              if attempted.exists() or not evidence.exists():
                  continue
              urls = []
              for line in evidence.read_text(encoding="utf-8").splitlines():
                  try:
                      url = json.loads(line).get("source_url")
                      if url and url not in urls:
                          urls.append(url)
                  except (ValueError, TypeError):
                      continue
              attempted.write_text("\\n".join(urls) + ("\\n" if urls else ""), encoding="utf-8")
              print(f"Reconstructed {attempted_name}: {len(urls)} evidenced URLs")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install crawler and Chromium
        run: |
          pip install 'crawl4ai==0.7.8' 'beautifulsoup4==4.14.3'
          crawl4ai-setup
      - name: Crawl permitted public pages
        env:
          CRAWL_MAX_URLS: ${{ inputs.max_urls || '250' }}
        run: python scripts/crawl4ai_ingredients.py
      - name: HTTP ingredient crawl fallback
        if: always()
        env:
          CRAWL_MAX_URLS: ${{ inputs.max_urls || '25' }}
        run: python scripts/http_ingredient_fallback.py
      - name: Extract JAN ingredient candidates
        if: always()
        run: python scripts/extract_crawl_ingredient_candidates.py
      - name: Save crawl results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl4ai-ingredient-evidence
          path: |
            data/crawl4ai_ingredient_evidence.jsonl
            data/http_ingredient_evidence.jsonl
            data/manufacturer_ingredient_candidates.csv
            data/crawl4ai_attempted_urls.txt
            data/http_attempted_urls.txt
          if-no-files-found: warn

