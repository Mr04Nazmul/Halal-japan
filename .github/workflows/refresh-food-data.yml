name: Refresh public food ingredient research data
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ingredient-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public Open Food Facts Japan research candidates
        env:
          OFF_PAGES: '3'
        run: python scripts/collect_off_japan.py
      - name: Commit changed research data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/off-japan-research.json
          if git diff --cached --quiet; then
            echo "No changed research data"
          else
            git commit -m "data: refresh attributed OFF Japan research candidates"
            git push
          fi
