name: Install UI UX Pro Max skill for Copilot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official UI UX Pro Max CLI
        run: npm install -g ui-ux-pro-max-cli
      - name: Initialize GitHub Copilot skill
        run: uipro init --ai copilot
      - name: Commit generated skill files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/skills .github/prompts .github/copilot-instructions.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new Copilot skill files were generated."
          else
            git commit -m "Install UI UX Pro Max skill for GitHub Copilot"
            git push
          fi
