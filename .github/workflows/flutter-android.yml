name: Flutter Android APK
on:
  workflow_dispatch:
  push:
    branches: [flutter-android-starter]
    paths:
      - 'flutter-app/**'
      - '.github/workflows/flutter-android.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: flutter-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project (preserve tracked Dart files)
        run: flutter create --platforms=android --project-name japan_halal_checker --no-overwrite .
      - name: Remove autogenerated template test
        run: rm -f test/widget_test.dart
      - name: Permit camera and internet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />')
          p.write_text(s)
          PY
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build installable APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: japan-halal-checker-flutter-apk
          path: flutter-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
