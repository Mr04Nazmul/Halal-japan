name: Japan map, prayer & ingredient checks
on:
  push:
    paths:
      - 'places-prayer.html'
      - 'places-prayer.js'
      - 'product-data.js'
      - 'index.html'
      - 'data/off-japan-research.json'
      - 'tests/places-prayer.cjs'
      - '.github/workflows/places-prayer-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check trilingual UI, maps math and ingredient dataset
        run: node tests/places-prayer.cjs
      - name: Check halal ingredient screening regression
        run: node tests/ingredient-regression.cjs
      - name: Check pinned prayer library availability
        run: |
          curl -fsSL --retry 2 --max-time 20 -o /tmp/adhan.js 'https://unpkg.com/adhan@4.4.4/lib/bundles/adhan.umd.min.js'
          test -s /tmp/adhan.js
          node --check /tmp/adhan.js
          curl -fsSL --retry 2 --max-time 20 -o /tmp/leaflet.js 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'
          test -s /tmp/leaflet.js
      - name: Check optional live Overpass availability (not a release blocker)
        shell: bash
        run: |
          set -euo pipefail
          if curl -A 'JapanHalalChecker/1.0 (+https://mr04nazmul.github.io/Halal-japan/)' -H 'Referer: https://mr04nazmul.github.io/Halal-japan/places-prayer.html' --max-time 16 -fsSL --data-urlencode 'data=[out:json][timeout:12];nwr(around:3000,34.6901,135.1955)["amenity"="place_of_worship"]["religion"="muslim"];out center 5;' 'https://overpass.private.coffee/api/interpreter' -o /tmp/overpass.json && jq -e '.elements | type=="array"' /tmp/overpass.json >/dev/null; then
            echo 'Live Overpass schema OK'
          else
            echo '::warning::Overpass unavailable from GitHub runner. Client falls back to live external map search. Real mobile map service is not yet confirmed.'
          fi
