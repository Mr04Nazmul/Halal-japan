name: Build Floot React Frontend
on:
  push:
    branches: [main, review/floot-scanner-preserved-build-fix, review/product-layout-favorites, fix/4902179023964-source-verification, review/sangaria-manufacturer-drinks-2026, review/verified-manufacturer-batch-oct13, review/japan-food-noodles-batch, review/strict-ingredient-research-oct13, review/data-coverage-multisource-oct13, fix/verdict-consistency-oct13, fix/strict-avoid-label-oct13, fix/food-verdict-engine-oct13, feature/additive-product-discovery-oct13, feature/seven-eleven-catalog-oct13, fix/ios-white-screen-oct13, restore/oct13-0303-working-site, fix/seven-cafe-box-2044706200126, fix/not-found-ingredient-photo-oct13, fix/strict-gelatin-rule-oct13]
    paths:
      - 'floot-source/**'
      - '.github/workflows/floot-frontend-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: floot-source
        run: npm install --no-audit --no-fund
      - name: Build React scanner and UI
        working-directory: floot-source
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: japan-halal-checker-floot-frontend
          path: floot-source/dist
          retention-days: 30
