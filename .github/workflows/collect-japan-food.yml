name: Collect Japanese ingredient records (Open Food Facts)
on:
  push:
    paths:
      - '.github/workflows/collect-japan-food.yml'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Pages of 100 products to check'
        required: false
        default: '20'
  schedule:
    - cron: '12 * * * *'
concurrency:
  group: ingredient-collector-${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect Japan products with ingredient text
        env:
          MAX_PAGES: ${{ inputs.pages || '20' }}
        run: python scripts/collect_japan_ingredients.py
      - name: Import extracted ingredient candidates to Supabase
        if: ${{ hashFiles('data/japan_ingredients.csv') != '' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.JHC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.JHC_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo 'Supabase credentials not configured; artifact only, no import.'
          else
            python scripts/import_collected_ingredients.py
          fi
      - name: Upload results and counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-food-ingredient-candidates
          path: |
            data/japan_ingredients.csv
            data/japan_ingredients_state.json
          if-no-files-found: warn
          retention-days: 7


