name: Ingredient checker regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  ingredient-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run ingredient regression cases
        run: |
          node tests/ingredient-regression.cjs
          node --test tests/seven-premium-evidence.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test OFF Japanese-language and JAN candidate validation
        run: python -m unittest discover -s tests -p 'test_off_japanese_candidates.py' -v
      - name: Install live scanner dependencies
        working-directory: floot-source
        run: npm install --no-audit --no-fund
      - name: Test actual React ingredient decision engine
        working-directory: floot-source
        run: |
          node --test tests/ingredientDecision.test.cjs
          node --test tests/halalCertificates.test.cjs
          node --test tests/sevenElevenEvidence.test.cjs
          node --test tests/yamayoProducts.test.cjs
          node --test tests/topvaluProducts.test.cjs
          node --test tests/ingredientSourceLinks.test.cjs
          node --test tests/barcodeProCleanHome.test.cjs
          node --test tests/publicManufacturerFoods.test.cjs
          node --test tests/barcodeProLayout.test.cjs
          npm run build
