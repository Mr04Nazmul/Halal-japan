name: Ingredient checker regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  ingredient-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run ingredient regression cases
        run: node tests/ingredient-regression.cjs
