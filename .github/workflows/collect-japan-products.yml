name: Collect Japan product research
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  push:
    paths:
      - 'scripts/collect_off_japan.py'
      - '.github/workflows/collect-japan-products.yml'
permissions:
  contents: write
concurrency:
  group: collect-japan-products
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and deduplicate public Japanese product leads
        env:
          OFF_PAGES: '2'
        run: python scripts/collect_off_japan.py
      - name: Commit new research batch, if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f data/off-japan-research.json ]; then
            echo 'No research file generated (source API unavailable); skipping commit safely.'
            exit 0
          fi
          git add data/off-japan-research.json
          if ! git diff --cached --quiet; then
            git commit -m "data: collect Japan-tagged Open Food Facts research records"
            git push
          fi
