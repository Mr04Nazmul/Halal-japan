name: Crawl Japanese Ingredients to 100k
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - scripts/crawl_japanese_ingredients.py
      - scripts/japan_ingredient_policy.py
      - scripts/japan_ingredient_food_filter.py
      - tests/test_japan_ingredient_food_filter.py
      - scripts/japan_ingredient_sources.json
      - .github/workflows/crawl-japanese-ingredients.yml
  pull_request:
    paths:
      - scripts/crawl_japanese_ingredients.py
      - scripts/japan_ingredient_policy.py
      - tests/test_japan_ingredient_crawler.py
      - tests/test_japan_ingredient_policy.py
permissions:
  contents: read
  actions: write
concurrency:
  group: japanese-ingredients-100k
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.14.3
      - name: Test source extraction, resumability and user ingredient rules
        run: python -m unittest discover -s tests -p 'test_japan_ingredient_*.py' -v
      - name: Restore latest persistent crawler checkpoint
        id: restore
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf crawler-state crawler-candidates
          mkdir -p crawler-state crawler-candidates
          mapfile -t previous_runs < <(
            gh api "repos/$REPOSITORY/actions/artifacts?name=japan-ingredients-state&per_page=30" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | reverse | .[:10] | .[].workflow_run.id' |
            awk '!seen[$0]++'
          )
          best_run=''
          best_count=-1
          for previous in "${previous_runs[@]}"; do
            candidate="crawler-candidates/$previous"
            mkdir -p "$candidate"
            if ! gh run download "$previous" --repo "$REPOSITORY" -n japan-ingredients-state -D "$candidate"; then
              continue
            fi
            count=$(python - "$candidate" <<'PY'
          import json,sqlite3,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          summary=json.load(open(root/'summary.json'))
          db=sqlite3.connect(root/'state.sqlite3')
          assert db.execute('pragma integrity_check').fetchone()[0]=='ok'
          expected=int(summary['accepted_ingredient_products'])
          assert db.execute('select count(*) from products where conflict=0').fetchone()[0]==expected
          print(expected)
          PY
            ) || continue
            # The newest *valid* checkpoint is authoritative. A safety fix may
            # intentionally remove invalid products, so max(count) can restore
            # stale data and replay the same queue indefinitely.
            best_count="$count"
            best_run="$previous"
            break
          done
          if [ -n "$best_run" ]; then
            cp -a "crawler-candidates/$best_run/." crawler-state/
            echo "Restored latest valid checkpoint: $best_count products from run $best_run"
          else
            echo 'First hosted run: previous 721-record chat checkpoint is separate; revalidate official sources without adding unimported counts.'
          fi
          rm -rf crawler-candidates
      - name: Crawl one bounded batch toward 100000 actual ingredient products
        if: github.ref == 'refs/heads/main'
        run: python -u scripts/crawl_japanese_ingredients.py --target 100000 --minutes 35 --max-pages 1500
      - name: Finalize consistent exports even after an interrupted batch
        id: finalize
        if: always() && github.ref == 'refs/heads/main' && steps.restore.outcome == 'success' && hashFiles('crawler-state/state.sqlite3') != ''
        run: python scripts/crawl_japanese_ingredients.py --checkpoint-only --target 100000
      - name: Preserve state and source-backed ingredient results
        id: checkpoint
        if: always() && steps.finalize.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: japan-ingredients-state
          path: crawler-state/
          retention-days: 90
          compression-level: 9
          if-no-files-found: error
      - name: Keep the latest three cumulative checkpoints
        if: steps.checkpoint.outcome == 'success'
        shell: bash
        run: |
          gh api "repos/$REPOSITORY/actions/artifacts?name=japan-ingredients-state&per_page=100" --jq '[.artifacts[] | select(.workflow_run.head_branch == "main")] | sort_by(.id) | reverse | .[3:][].id' |
          while read -r artifact; do
            gh api -X DELETE "repos/$REPOSITORY/actions/artifacts/$artifact"
          done
      - name: Show precise ingredient progress
        if: always() && hashFiles('crawler-state/summary.json') != ''
        run: cat crawler-state/summary.json >> "$GITHUB_STEP_SUMMARY"

# Manual batch wake: 2026-10-17T21:53+09:00 (resume existing checkpoint; keep 100000 target)
