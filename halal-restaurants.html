<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halal Restaurants · Japan Halal Checker</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{font:15px/1.5 system-ui,sans-serif;margin:0;color:#20372d;background:#f2f7f2}header{background:#0c382b;color:#fff;padding:20px 16px}header a{color:#d9f3df;text-decoration:none}main{max-width:820px;margin:auto;padding:18px 14px 90px}h1{font-size:23px;margin:8px 0}.sub{color:#557064}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.controls input,.controls select{flex:1;min-width:140px;padding:12px;border:1px solid #b7d0be;border-radius:12px;background:white;font:inherit}.item{background:white;border:1px solid #d6e5d9;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #1043290a}.item h2{font-size:17px;margin:0 0 6px}.photo{height:148px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e7f4ea,#cde4d7);border-radius:12px;margin-bottom:12px;overflow:hidden;color:#215d42;font-size:40px}.photo img{width:100%;height:100%;object-fit:cover}.photo small{display:block;font-size:12px;font-weight:700;color:#365e4c}.tag{display:inline-block;padding:3px 9px;border-radius:20px;background:#eaf5e7;color:#235d3b;font-size:12px;font-weight:700}.partial{background:#fff0d2;color:#7c5600}.item p{margin:8px 0}.actions{display:flex;gap:14px;flex-wrap:wrap}.actions a{color:#076c43;font-weight:700}.disclaimer{border-left:3px solid #b8964d;padding:11px;background:#fff7e8;border-radius:8px}nav{position:fixed;bottom:0;left:0;right:0;background:#0c382b;display:flex;justify-content:center;padding:13px 8px;padding-bottom:calc(13px + env(safe-area-inset-bottom));gap:24px}nav a{color:white;text-decoration:none}small{color:#60716a}
</style></head><body><header><a href="./index.html">← Japan Halal Checker</a><h1>Halal Restaurants · Places</h1><div>Tokyo · Kyoto · Nara · More cities coming</div></header><main><div class="controls"><input id="search" aria-label="Search restaurants" placeholder="Search name, city or food…"><select id="city" aria-label="Filter city"><option value="">All cities</option><option>Tokyo</option><option>Kyoto</option><option>Nara</option></select><select id="status" aria-label="Filter halal type"><option value="">All halal types</option><option value="Halal Certified">Halal certified (reported)</option><option value="100% Halal">100% halal (reported)</option><option value="Partially Halal">Partially halal</option></select></div><p id="count" class="sub"></p><div id="results" aria-live="polite"></div><small>Halal options and hours may change; confirm details with the restaurant.</small></main><nav aria-label="Navigation"><a href="./index.html">⌂ Home</a><a href="./halal-restaurants.html">⌖ Places</a><a href="./index.html">▣ Scan</a></nav><script src="./restaurant-data.js"></script><script>
const data=window.JAPAN_HALAL_RESTAURANTS?.restaurants||[];
const $=id=>document.getElementById(id);
function render(){const q=$('search').value.trim().toLowerCase(),city=$('city').value,status=$('status').value;const rows=data.filter(x=>(!city||x.city===city)&&(!status||x.status.includes(status))&&(!q||[x.name,x.city,x.area,x.cuisine,x.address].some(v=>v.toLowerCase().includes(q))));$('count').textContent=rows.length+' restaurants listed';$('results').replaceChildren();for(const x of rows){const article=document.createElement('article');article.className='item';const pic=document.createElement('div');pic.className='photo';if(x.licensed_image_url){const img=document.createElement('img');img.alt=x.name+' restaurant';img.loading='lazy';img.src=x.licensed_image_url;img.onerror=()=>{pic.textContent='🍽️';};pic.append(img)}else{const imagePlaceholder=document.createElement('div');imagePlaceholder.style.textAlign='center';imagePlaceholder.textContent='🍽️';const note=document.createElement('small');note.textContent='View restaurant photos in Maps ↗';imagePlaceholder.append(note);pic.append(imagePlaceholder)}const h=document.createElement('h2');h.textContent=x.name;const badge=document.createElement('span');badge.className='tag'+(x.status.includes('Partially')?' partial':'');badge.textContent=x.status;const loc=document.createElement('p');loc.textContent=x.city+' · '+x.area+' · '+x.cuisine;const addr=document.createElement('small');addr.textContent=x.address;const actions=document.createElement('p');actions.className='actions';const map=document.createElement('a');map.textContent='View photos & location on Google Maps ↗';map.target='_blank';map.rel='noopener';map.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.name+' '+x.address);actions.append(map);article.append(pic,h,badge,loc,addr,actions);$('results').append(article)}}
['search','city','status'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));render();
</script></body></html>
